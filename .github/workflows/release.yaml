name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 連続マージで run が並走し、古いコミットのビルドが後から完了しないようにする
    concurrency:
      group: release-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      matrix:
        target: [api, discord]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 古い run の再実行や後から完了した run で latest が巻き戻らないよう、
      # default branch の先頭コミットのビルドでだけ latest を付ける
      - name: Check if this commit is the head of the default branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          is_head=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
            if [ "${head_sha}" = "${GITHUB_SHA}" ]; then
              is_head=true
            fi
          fi
          echo "is_head=${is_head}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          # latest は default branch 先頭のビルドでだけ付ける。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.head.outputs.is_head }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
