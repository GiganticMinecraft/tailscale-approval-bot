name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # latest を付けるかの判定で run の一覧を読む
      actions: read
    # 連続マージや古い run の再実行で run が並走し、古いコミットのビルドが後から完了しないよう
    # 順に待たせる (cancel すると途中コミットの sha タグが push されなくなる)
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      matrix:
        target: [api, discord]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # default branch のビルドで latest を付ける。ただし、この workflow の default branch 上の
      # 最新の run が別コミットのもの (古い run の再実行や、完了順の逆転) なら付けない。
      # 「branch の先頭コミットか」で判定すると、paths フィルタ等でこの workflow を起動しない
      # コミットが後に続いたとき latest が進まなくなるため、run の新しさで判定する
      - name: Decide whether to tag latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          enable=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            workflow_file=${GITHUB_WORKFLOW_REF%@*}
            workflow_file=${workflow_file##*/}
            if ! newest_sha=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow "${workflow_file}" \
                --branch "${DEFAULT_BRANCH}" --event push --limit 1 --json headSha --jq '.[0].headSha'); then
              # API が失敗しても sha タグのビルドは止めない。初回実行なら latest を付け、
              # 巻き戻りうる再実行では付けない
              echo "::warning::最新の run を取得できなかった (run_attempt=${GITHUB_RUN_ATTEMPT})"
              if [ "${GITHUB_RUN_ATTEMPT}" = 1 ]; then
                enable=true
              fi
            elif [ "${newest_sha}" = "${GITHUB_SHA}" ]; then
              enable=true
            else
              echo "::notice::より新しいコミット (${newest_sha}) の run があるので latest を付けない"
            fi
          fi
          echo "enable=${enable}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          # latest は default branch のビルドでだけ付ける (条件は上の step)。seichi_infra のマニフェストは
          # latest@sha256:... で参照し、Renovate が digest の変化を追従する
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
